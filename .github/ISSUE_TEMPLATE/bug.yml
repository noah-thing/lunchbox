name: Bug
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lunchbox version
      placeholder: 0.1.0
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: agents
    attributes:
      label: Agents in the room
      placeholder: Claude Code, Codex, Grok
