name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Installers and the update files go to the public lunchbox-releases repo, which the app's
      # updater reads. RELEASES_TOKEN may write to that repo only.
      # The Windows installer is signed with Azure Artifact Signing once the AZURE_* variables and
      # secrets exist; without them it builds unsigned, as before.
      - run: npx electron-builder ${{ matrix.target }} ${{ matrix.os == 'windows-latest' && vars.AZURE_SIGNING_ACCOUNT && format('"-c.win.azureSignOptions.publisherName={0}" -c.win.azureSignOptions.endpoint={1} -c.win.azureSignOptions.certificateProfileName={2} -c.win.azureSignOptions.codeSigningAccountName={3}', vars.AZURE_PUBLISHER_NAME, vars.AZURE_SIGNING_ENDPOINT, vars.AZURE_CERT_PROFILE, vars.AZURE_SIGNING_ACCOUNT) || '' }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: lunchbox-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.yml
          if-no-files-found: error
